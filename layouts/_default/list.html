{{ define "main" }}
<section class="pt-10 sm:pt-14 pb-8">
    <h1 class="text-3xl sm:text-4xl font-extrabold text-orange tracking-tight">{{ .Title }}</h1>
    <ul class="mt-8 max-w-3xl space-y-6">
        {{ range .Pages }}
        <li class="border-t-2 border-orange-soft pt-4">
            <h2 class="font-bold text-navy">
                <a href="{{ .RelPermalink }}" class="hover:text-orange-deep">{{ .Title }}</a>
            </h2>
            {{ with .Description }}<p class="mt-1 text-sm text-slate">{{ . }}</p>{{ end }}
        </li>
        {{ end }}
    </ul>
</section>
{{ end }}
