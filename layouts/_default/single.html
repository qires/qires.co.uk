{{ define "main" }}
<section class="py-20">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <article class="bg-white rounded-2xl shadow-sm p-8 lg:p-12">
            <header class="mb-8">
                <h1 class="text-3xl sm:text-4xl font-bold text-navy font-heading mb-4">{{ .Title }}</h1>
                {{ with .Description }}
                <p class="text-lg text-dark-text/70">{{ . }}</p>
                {{ end }}
            </header>
            <div class="prose prose-lg max-w-none">
                {{ .Content }}
            </div>
        </article>
        <div class="mt-8 text-center">
            <a href="#" class="inline-flex items-center text-brand hover:text-brand/80 transition-colors duration-150">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Home
            </a>
        </div>
    </div>
</section>
{{ end }}
