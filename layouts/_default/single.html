{{ define "main" }}
<article class="pt-10 sm:pt-14 pb-8 max-w-3xl">
    <h1 class="text-3xl sm:text-4xl font-extrabold text-orange tracking-tight">{{ .Title }}</h1>
    {{ with .Description }}
    <p class="mt-4 font-bold uppercase tracking-wide text-orange-deep">{{ . }}</p>
    {{ end }}
    <div class="mt-8 prose text-navy">
        {{ .Content }}
    </div>
    <p class="mt-10">
        <a href="{{ .Site.Home.RelPermalink }}" class="font-bold text-orange-deep hover:text-navy">&larr; Back to home</a>
    </p>
</article>
{{ end }}
