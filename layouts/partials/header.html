{{ $home := .Site.Home.RelPermalink }}
<header class="sticky top-0 z-40 bg-cream/95 backdrop-blur-sm">
    <!-- The navy rule runs the full width of the page and through the mark,
         continuing the horizontal line drawn in the logo itself -->
    <span class="logo-rule" aria-hidden="true"></span>

    <div class="mx-auto w-full max-w-[1400px] px-5 sm:px-8 lg:px-12">
        <div class="logo-row">
            <!-- Menu button (small screens; the section rail replaces it from lg up) -->
            <button id="menu-btn" class="menu-btn lg:hidden" aria-label="Open menu"
                    aria-expanded="false" aria-controls="mobile-menu">
                <span></span><span></span><span></span>
            </button>

            <a href="{{ $home }}" class="logo-lockup" aria-label="{{ .Site.Title }} — home">
                <img src="{{ "img/logo-mark.png" | relURL }}" alt="" width="469" height="600" class="logo-mark">
                <span class="logo-word"><span class="text-orange">QI R</span>esolved</span>
            </a>
        </div>
    </div>

    <!-- Slide-down menu for small screens -->
    <nav id="mobile-menu" class="mobile-menu lg:hidden" hidden aria-label="Sections">
        <ul>
            {{ range .Site.Params.sections }}
            <li><a href="{{ printf "%s#%s" $home .id }}">{{ .label }}</a></li>
            {{ end }}
            <li><a href="mailto:{{ $.Site.Params.email }}">Get in touch</a></li>
        </ul>
    </nav>
</header>
